<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karaoke Davivienda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
/* ===== TIPOGRAFÍA (opcional): pon tu fuente en assets/fonts/fuente.woff2 ===== */
@font-face{font-family:"FuenteKaraoke";src:url("assets/fonts/fuente.TTF") format("woff2");font-weight:100 900;font-display:swap}

:root{--rojo:#ea1c24;--negro:#080808;--gris:#f1f1f1;
  /* ===== FONDOS: nombres de archivo dentro de assets/ ===== */
  --bg-bienvenidos:url("assets/fondo_1.webp");
  --bg-formulario:url("assets/fondo_2.webp");
  --bg-escoger:url("assets/fondo_2.webp");
  --bg-karaoke:url("assets/fondo_3.webp");
  --bg-mezcla:url("assets/fondo_1.webp");
}

*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000}
body{font-family:"FuenteKaraoke","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--negro)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;
  padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom);background-size:cover;background-position:center}
.screen.on{display:flex}
h1{font-weight:800;letter-spacing:.14em;line-height:1.15;text-transform:uppercase}
p{line-height:1.35}
.logo{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);height:34px;max-width:70%}

.btn{display:block;width:100%;max-width:340px;border:0;border-radius:999px;padding:16px 20px;font:700 20px/1 inherit;font-family:inherit;
  color:#fff;background:var(--rojo);box-shadow:0 0 22px rgba(255,255,255,.28);cursor:pointer}
.btn.blanco{background:#fff;color:var(--rojo)}
.btn.borde{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.55);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.cancion:focus-visible{outline:3px solid #fff;outline-offset:3px}
.fila{display:flex;gap:12px;width:100%}.fila .btn{font-size:18px}

/* Bienvenidos y mezcla */
#s-bienvenidos,#s-mezcla{justify-content:center;gap:34px;background-color:#150708}
#s-bienvenidos{background-image:var(--bg-bienvenidos)}
#s-mezcla{background-image:var(--bg-mezcla)}
#s-bienvenidos h1,#s-mezcla h1{font-size:clamp(30px,9.4vw,44px)}
#s-bienvenidos p,#s-mezcla p{font-size:clamp(19px,5.6vw,25px);max-width:360px}
#s-bienvenidos .btn,#s-mezcla .btn{margin-top:6px}

/* Formulario */
#s-formulario{background-color:var(--rojo);background-image:var(--bg-formulario);padding:0}
.tarjeta{position:absolute;top:11%;bottom:0;left:0;right:0;background:#fff;border-radius:40px 40px 0 0;padding:34px 24px;color:var(--rojo);
  display:flex;flex-direction:column;align-items:stretch;text-align:left;overflow-y:auto}
.tarjeta h1{text-align:center;font-size:clamp(28px,8.5vw,40px);margin-bottom:34px}
label{display:block;font-weight:800;letter-spacing:.12em;font-size:17px;text-transform:uppercase;margin:0 0 8px 2px}
input[type=text],input[type=email],input[type=tel]{width:100%;border:0;border-radius:999px;background:var(--gris);padding:14px 20px;font:17px inherit;font-family:inherit;color:#222;margin-bottom:22px}
.acepto{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.35;color:#444;margin:2px 0 8px;letter-spacing:0;text-transform:none;font-weight:400}
.acepto input{width:20px;height:20px;accent-color:var(--rojo);flex:none;margin-top:1px}
.error{color:#b00010;font-size:14px;min-height:20px;margin:4px 0 10px}
.tarjeta .btn{margin:auto auto 0;box-shadow:none}

/* Escoger */
#s-escoger{background-color:var(--rojo);background-image:var(--bg-escoger);padding-top:calc(46px + env(safe-area-inset-top))}
#s-escoger h1{font-size:clamp(30px,9vw,42px);margin-bottom:22px}
.panel{flex:1;min-height:0;width:100%;background:rgba(80,0,5,.82);border-radius:30px;padding:18px 16px;display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
#buscar{margin:0;padding:12px 20px}
#lista{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px;scrollbar-color:#fff transparent}
.cancion{display:flex;align-items:center;gap:16px;width:100%;background:none;border:2px solid transparent;border-radius:14px;padding:6px;color:#fff;font:inherit;text-align:left;cursor:pointer}
.cancion.sel{border-color:#fff;background:rgba(255,255,255,.12)}
.cancion .ico{flex:none;width:62px;height:62px;border-radius:8px;background:var(--rojo) center/cover no-repeat;display:grid;place-items:center}
.cancion span.t{letter-spacing:.1em;font-size:15px;line-height:1.3;text-transform:uppercase}
#s-escoger .btn{margin-bottom:calc(26px + env(safe-area-inset-bottom))}

/* Karaoke */
#s-karaoke{background-color:#000;background-image:var(--bg-karaoke);padding-top:calc(60px + env(safe-area-inset-top))}
#s-karaoke h1{font-size:clamp(30px,9vw,42px)}
#letra{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;width:100%;overflow:hidden}
#letra div{font-weight:800;letter-spacing:.1em;line-height:1.2;text-transform:uppercase;font-size:clamp(17px,5.2vw,25px);transition:color .2s,opacity .2s;opacity:.55}
#letra div.ya{opacity:.3}#letra div.ahora{color:var(--rojo);opacity:1}
#letra.fija div{opacity:1}
#estado{font-style:italic;letter-spacing:.14em;font-size:15px;text-transform:uppercase;margin-bottom:12px}
.onda{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.barras{display:flex;align-items:center;gap:4px;height:48px}
.barras i{display:block;width:4px;height:8px;border-radius:2px;background:#fff;animation:bar 1s ease-in-out infinite}
.barras.quieta i{animation:none}
@keyframes bar{50%{height:44px}}
#s-karaoke .fila{margin-bottom:calc(30px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){.barras i{animation:none}}
</style>
</head>
<body>
<div id="app">

  <!-- 1. BIENVENIDOS -->
  <section class="screen on" id="s-bienvenidos">
    <h1>Bienvenidos<br>al karaoke</h1>
    <p>Prepárate para cantar, grabar tu voz y crear tu propia mezcla</p>
    <button class="btn" id="b-comenzar">Comenzar</button>
    <img class="logo" src="assets/logo.png" alt="Davivienda · Visa" onerror="this.remove()">
  </section>

  <!-- 2. FORMULARIO -->
  <section class="screen" id="s-formulario">
    <div class="tarjeta">
      <h1>Tus datos</h1>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Escribe tu nombre" autocomplete="name">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="ejemplo@correo.com" autocomplete="email">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" placeholder="(000) 000 - 00 00" autocomplete="tel">
      <label class="acepto"><input type="checkbox" id="acepto">
        <span>Autorizo el tratamiento de mis datos personales y de mi grabación de voz para recibir mi mezcla por correo. <!-- AQUÍ: enlace a la política de datos --></span></label>
      <div class="error" id="err-form" role="alert"></div>
      <button class="btn" id="b-form">Siguiente</button>
    </div>
  </section>

  <!-- 3. ESCOGER CANCIÓN -->
  <section class="screen" id="s-escoger">
    <h1>Escoge tu<br>canción</h1>
    <div class="panel">
      <input type="text" id="buscar" placeholder="Buscar" aria-label="Buscar canción">
      <div id="lista"></div>
    </div>
    <button class="btn blanco" id="b-escoger" disabled style="color:var(--rojo)">Siguiente</button>
  </section>

  <!-- 4. KARAOKE -->
  <section class="screen" id="s-karaoke">
    <h1>¡A cantar!</h1>
    <div id="letra" aria-live="polite"></div>
    <div id="estado">Preparando micrófono...</div>
    <div class="onda">
      <svg width="38" height="52" viewBox="0 0 24 32" fill="#fff" aria-hidden="true"><rect x="8" y="0" width="8" height="18" rx="4"/><path d="M4 14v1a8 8 0 0 0 16 0v-1h-2v1a6 6 0 0 1-12 0v-1z"/><rect x="11" y="23" width="2" height="5"/><rect x="6" y="28" width="12" height="2.5" rx="1.2"/></svg>
      <div class="barras quieta" id="barras"></div>
    </div>
    <div class="fila">
      <button class="btn borde" id="b-repetir">Repetir</button>
      <button class="btn" id="b-terminar">Siguiente</button>
    </div>
  </section>

  <!-- 5. MEZCLA -->
  <section class="screen" id="s-mezcla">
    <h1 id="m-titulo">Mezclando<br>tu voz</h1>
    <p id="m-texto">Esto toma unos segundos. No cierres la página.</p>
    <button class="btn" id="b-inicio" hidden>Volver al inicio</button>
    <img class="logo" src="assets/logo.png" alt="Davivienda · Visa" onerror="this.remove()">
  </section>
</div>

<script>
/* ================= CONFIGURACIÓN ================= */
const SCRIPT_URL = "PEGA_AQUI_LA_URL_DE_APPS_SCRIPT";   // URL de la aplicación web (termina en /exec)
const SECRET     = "CAMBIA-ESTA-CLAVE";                  // la misma de Code.gs
const VOZ_GANANCIA = 1.4;      // volumen de la voz en la mezcla
const PISTA_GANANCIA = 0.8;    // volumen de la pista en la mezcla
const VOZ_ADELANTO = 0;        // segundos a recortar del inicio de la voz si queda desfasada (ej. 0.15)

/* Canciones: archivos dentro de assets/songs/. "lrc" es la letra con tiempos (.lrc) o un .txt sin tiempos. */
const CANCIONES = [
  {titulo:"La Camisa Negra", artista:"Juanes", audio:"assets/cancion-1/01.mp3", lrc:"assets/cancion-1/01.lrc", portada:"assets/1.webp"},
  {titulo:"A Dios Le Pido", artista:"Juanes", audio:"assets/cancion-2/02.mp3", lrc:"assets/cancion-2/02.lrc", portada:"assets/2.webp"},
  {titulo:"Mala Gente", artista:"Juanes", audio:"assets/cancion-3/03.mp3", lrc:"assets/cancion-3/03.lrc", portada:"assets/2.webp"},
  {titulo:"Volverte A Ver", artista:"Juanes", audio:"assets/cancion-4/04.mp3", lrc:"assets/cancion-4/04.lrc", portada:"assets/1.webp"},
  {titulo:"Es Por Ti", artista:"Juanes", audio:"assets/cancion-5/05.mp3", lrc:"assets/cancion-5/05.lrc", portada:"assets/2.webp"},
  {titulo:"Nada Valgo Sin Tu Amor", artista:"Juanes", audio:"assets/cancion-6/06.mp3", lrc:"assets/cancion-6/06.lrc", portada:"assets/1.webp"},
  {titulo:"Besos En Guerra", artista:"Juanes", audio:"assets/cancion-7/07.mp3", lrc:"assets/cancion-7/07.lrc", portada:"assets/3.webp"},
  {titulo:"Ojalá", artista:"Juanes", audio:"assets/cancion-8/08.mp3", lrc:"assets/cancion-8/08.lrc", portada:"assets/4.webp"},
];
/* ================================================== */

const $ = id => document.getElementById(id);
const ir = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
let persona = {}, cancion = null, lineas = [], conTiempos = false;
let audio, stream, recorder, partes = [], corriendo = false, terminado = false;

/* ---- Barras de la onda ---- */
(() => { const b = $("barras"); for (let i = 0; i < 28; i++) { const e = document.createElement("i"); e.style.animationDelay = (-Math.random()).toFixed(2) + "s"; e.style.animationDuration = (0.6 + Math.random() * 0.7).toFixed(2) + "s"; b.appendChild(e); } })();

/* ---- 1 → 2 ---- */
$("b-comenzar").onclick = () => ir("s-formulario");

/* ---- 2 → 3 ---- */
$("b-form").onclick = () => {
  const n = $("nombre").value.trim(), c = $("correo").value.trim(), t = $("telefono").value.trim();
  let e = "";
  if (n.length < 2) e = "Escribe tu nombre.";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) e = "Escribe un correo válido, por ejemplo nombre@correo.com.";
  else if (t.replace(/\D/g, "").length < 7) e = "Escribe un teléfono de al menos 7 dígitos.";
  else if (!$("acepto").checked) e = "Acepta el tratamiento de datos para continuar.";
  $("err-form").textContent = e;
  if (e) return;
  persona = {name: n, email: c, phone: t};
  ir("s-escoger");
};

/* ---- 3: lista de canciones ---- */
function pintarLista() {
  const q = $("buscar").value.trim().toLowerCase(), l = $("lista");
  l.innerHTML = "";
  CANCIONES.filter(s => (s.titulo + " " + s.artista).toLowerCase().includes(q)).forEach(s => {
    const b = document.createElement("button");
    b.className = "cancion" + (cancion === s ? " sel" : "");
    b.innerHTML = '<span class="ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3z"/></svg></span><span class="t"></span>';
    b.querySelector(".t").textContent = s.titulo + " - " + s.artista;
    if (s.portada) b.querySelector(".ico").style.backgroundImage = 'url("' + s.portada + '")';
    b.onclick = () => { cancion = s; $("b-escoger").disabled = false; pintarLista(); };
    l.appendChild(b);
  });
}
$("buscar").oninput = pintarLista;
pintarLista();
$("b-escoger").onclick = () => { if (cancion) iniciarKaraoke(); };

/* ---- Letra (.lrc) ---- */
async function cargarLetra(url) {
  lineas = []; conTiempos = false;
  try {
    const r = await fetch(url); if (!r.ok) throw 0;
    const txt = await r.text();
    txt.split(/\r?\n/).forEach(raw => {
      const tiempos = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
      const texto = raw.replace(/\[[^\]]*\]/g, "").trim();
      if (tiempos.length) { conTiempos = true; tiempos.forEach(m => lineas.push({t: +m[1] * 60 + +m[2], x: texto})); }
      else if (texto) lineas.push({t: null, x: texto});
    });
    if (conTiempos) lineas = lineas.filter(l => l.t !== null).sort((a, b) => a.t - b.t);
  } catch (e) { lineas = [{t: null, x: "La letra no está disponible"}]; }
}
function pintarLetra(t) {
  const cont = $("letra");
  if (!conTiempos) { cont.className = "fija"; cont.innerHTML = ""; lineas.forEach(l => { const d = document.createElement("div"); d.textContent = l.x; cont.appendChild(d); }); return; }
  let i = -1; for (let k = 0; k < lineas.length; k++) if (lineas[k].t <= t) i = k; else break;
  cont.className = ""; cont.innerHTML = "";
  for (let k = i - 1; k <= i + 3; k++) {
    if (k < 0 || k >= lineas.length) continue;
    const d = document.createElement("div"); d.textContent = lineas[k].x || "♪";
    d.className = k < i ? "ya" : k === i ? "ahora" : ""; cont.appendChild(d);
  }
}

/* ---- 4: karaoke ---- */
async function iniciarKaraoke() {
  ir("s-karaoke"); terminado = false;
  $("estado").textContent = "Preparando micrófono..."; $("barras").classList.add("quieta");
  await cargarLetra(cancion.lrc); pintarLetra(0);
  try {
    if (!stream) stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: false, autoGainControl: false}});
  } catch (e) { $("estado").textContent = "Permite el micrófono para poder cantar"; return; }
  empezar();
}
function empezar() {
  partes = [];
  audio = new Audio(cancion.audio);
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => e.data.size && partes.push(e.data);
  audio.ontimeupdate = () => pintarLetra(audio.currentTime);
  audio.onended = () => terminar();
  recorder.start();
  audio.play().then(() => { corriendo = true; $("estado").textContent = "Grabando audio..."; $("barras").classList.remove("quieta"); })
    .catch(() => { $("estado").textContent = "No se pudo reproducir la pista"; });
}
function detener() {
  return new Promise(res => {
    corriendo = false; $("barras").classList.add("quieta");
    if (audio) { audio.ontimeupdate = audio.onended = null; audio.pause(); }
    if (recorder && recorder.state !== "inactive") { recorder.onstop = () => res(new Blob(partes, {type: recorder.mimeType})); recorder.stop(); }
    else res(new Blob(partes));
  });
}
$("b-repetir").onclick = async () => { await detener(); pintarLetra(0); if (stream) empezar(); else iniciarKaraoke(); };
$("b-terminar").onclick = () => terminar();
async function terminar() {
  if (terminado) return; terminado = true;
  const voz = await detener();
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  mezclarYEnviar(voz);
}

/* ---- 5: mezcla y envío ---- */
function mensaje(titulo, texto, boton) {
  $("m-titulo").innerHTML = titulo; $("m-texto").textContent = texto; $("b-inicio").hidden = !boton; $("b-inicio").textContent = boton || "";
}
async function mezclarYEnviar(voz) {
  ir("s-mezcla"); mensaje("Mezclando<br>tu voz", "Esto toma unos segundos. No cierres la página.", "");
  try {
    if (voz.size < 2000) throw new Error("No se grabó audio. Revisa el micrófono e inténtalo de nuevo.");
    const mp3 = await mezclar(voz);
    mensaje("Enviando<br>tu mezcla", "Subiendo el audio... 0%", "");
    const slug = persona.name.normalize("NFD").replace(/[^\w]+/g, "_").slice(0, 30);
    await subir(mp3, "mezcla_" + slug + "_" + Date.now() + (mp3.type === "audio/wav" ? ".wav" : ".mp3"));
    mensaje("¡Mezcla<br>en camino!", "Estamos procesando tu mezcla de audio. Se ha enviado directamente a tu correo electrónico", "Volver al inicio");
  } catch (e) {
    mensaje("Algo salió<br>mal", String(e.message || e) + " Vuelve a intentarlo.", "Volver al inicio");
  }
}
$("b-inicio").onclick = () => { cancion = null; $("b-escoger").disabled = true; pintarLista(); ir("s-bienvenidos"); };

async function mezclar(voz) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const [vb, pb] = await Promise.all([
    voz.arrayBuffer().then(b => ctx.decodeAudioData(b)),
    fetch(cancion.audio).then(r => r.arrayBuffer()).then(b => ctx.decodeAudioData(b))
  ]);
  ctx.close();
  const SR = 44100, dur = Math.max(1, Math.min(pb.duration, vb.duration - VOZ_ADELANTO));
  const off = new OfflineAudioContext(1, Math.ceil(dur * SR), SR);
  const fuente = (buf, g, desde) => { const s = off.createBufferSource(), n = off.createGain(); s.buffer = buf; n.gain.value = g; s.connect(n).connect(off.destination); s.start(0, desde); };
  fuente(pb, PISTA_GANANCIA, 0); fuente(vb, VOZ_GANANCIA, VOZ_ADELANTO);
  const f = (await off.startRendering()).getChannelData(0);
  const pcm = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) pcm[i] = Math.max(-1, Math.min(1, f[i])) * 32767;
  if (window.lamejs) {
    const enc = new lamejs.Mp3Encoder(1, SR, 128), out = [];
    for (let i = 0; i < pcm.length; i += 1152) { const b = enc.encodeBuffer(pcm.subarray(i, i + 1152)); if (b.length) out.push(b); if (i % 115200 === 0) await new Promise(r => setTimeout(r)); }
    out.push(enc.flush());
    return new Blob(out, {type: "audio/mpeg"});
  }
  /* Respaldo: WAV si la librería MP3 no cargó */
  const h = new DataView(new ArrayBuffer(44)), w = (o, s) => [...s].forEach((c, i) => h.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); h.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVEfmt "); h.setUint32(16, 16, true); h.setUint16(20, 1, true); h.setUint16(22, 1, true);
  h.setUint32(24, SR, true); h.setUint32(28, SR * 2, true); h.setUint16(32, 2, true); h.setUint16(34, 16, true); w(36, "data"); h.setUint32(40, pcm.length * 2, true);
  return new Blob([h, pcm], {type: "audio/wav"});
}

const TROZO = 3 * 262144; /* múltiplo de 256 KB, lo exige Drive */
const aB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
async function subir(blob, nombre) {
  const id = Date.now() + "-" + Math.random().toString(36).slice(2, 8), total = blob.size;
  for (let ini = 0; ini < total; ini += TROZO) {
    const fin = Math.min(ini + TROZO, total), data = await aB64(blob.slice(ini, fin));
    const cuerpo = JSON.stringify({secret: SECRET, action: "chunk", id, name: nombre, mime: blob.type, total, start: ini, end: fin, data,
      person: persona, to: persona.email, song: cancion.titulo + " - " + cancion.artista});
    let r, ultimo;
    for (let i = 0; i < 3 && !(r && r.ok); i++) {
      try { r = await (await fetch(SCRIPT_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: cuerpo})).json(); ultimo = r.error; }
      catch (e) { ultimo = "Sin conexión con el servidor."; r = null; await new Promise(x => setTimeout(x, 1200)); }
    }
    if (!r || !r.ok) throw new Error(ultimo || "No se pudo enviar el audio.");
    $("m-texto").textContent = "Subiendo el audio... " + Math.round(fin / total * 100) + "%";
    if (r.done && r.mailError) throw new Error("El audio se guardó pero el correo no se pudo enviar.");
  }
}
